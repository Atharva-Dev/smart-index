# Gradle runs on JDK 21 (Android Studio JBR); modules compile to Java 17 bytecode (no toolchain download).
org.gradle.jvmargs=-Xmx3g -XX:MaxMetaspaceSize=1g -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=true
android.useAndroidX=true
android.nonTransitiveRClass=true
kotlin.code.style=official
# Release signing (LLD — App shell §6.4) is read from ~/.gradle/gradle.properties, never from this file:
#   SMARTINDEX_KEYSTORE_FILE, SMARTINDEX_KEYSTORE_PASSWORD, SMARTINDEX_KEY_ALIAS, SMARTINDEX_KEY_PASSWORD
kotlin.daemon.jvmargs=-Xmx1536m
